{% extends "base.html" %}
{% block title %}Mi perfil · {{ group_name }}{% endblock %}
{% block content %}
<h1>Mi perfil</h1>
<form method="post" class="card form">
  <input type="hidden" name="csrf" value="{{ csrf_token }}">
  <p class="muted small">Usuario: <strong>{{ u.username }}</strong>. Estos datos los ve el resto del grupo.</p>
  <label>Nombre completo <input name="name" value="{{ u.name }}" required></label>
  <div class="row">
    <label>Correo <input name="email" type="email" value="{{ u.email or '' }}"></label>
    <label>Teléfono <input name="phone" value="{{ u.phone or '' }}"></label>
  </div>
  <div class="row">
    <label>WhatsApp <input name="whatsapp" value="{{ u.whatsapp or '' }}" placeholder="3001234567"></label>
    <label>Cumpleaños <input name="birthday" type="date" value="{{ u.birthday.isoformat() if u.birthday else '' }}"></label>
  </div>
  <label>Sobre mí / otros datos
    <textarea name="about" rows="4" placeholder="Horarios en que puedo reunirme, trabajo, LinkedIn, en qué soy bueno/a…">{{ u.about or '' }}</textarea></label>
  <details>
    <summary>Cambiar contraseña</summary>
    <div class="row">
      <label>Contraseña actual <input name="current_password" type="password" autocomplete="current-password"></label>
      <label>Nueva contraseña <input name="new_password" type="password" minlength="6" autocomplete="new-password"></label>
    </div>
  </details>
  <button class="btn" type="submit">Guardar</button>
</form>
{% endblock %}
